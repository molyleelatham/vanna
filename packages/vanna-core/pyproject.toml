[project]
name = "vanna-core"
version = "0.1.0"
description = "Shared privacy, schemas, and decisioning for Vanna"
requires-python = ">=3.11,<4.0"
dependencies = [
  "pydantic>=2.10,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vanna_core"]
