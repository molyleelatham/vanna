[project]
name = "vanna-federation"
version = "0.1.0"
description = "Five-desk federated FX execution model for Vanna"
requires-python = ">=3.11,<4.0"
license = { file = "LICENSE" }
dependencies = [
  "flwr[simulation]>=1.35.0,<2.0",
  "numpy>=2.0,<3.0",
  "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vanna_federation"]

[tool.flwr.app]
publisher = "vanna"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["vanna_federation/**/*.py", "LICENSE"]

[tool.flwr.app.components]
serverapp = "vanna_federation.server_app:app"
clientapp = "vanna_federation.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-trees = 1
fraction-evaluate = 1.0
